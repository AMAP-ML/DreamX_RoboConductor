name: deploy-pages
triggers:
  push:
jobs:
  deploy:
    image: alios-8u
    steps:
      - uses: checkout
      - id: prepare-downloads
        run: |
          python3 scripts/sanitize_public_data.py --check
          python3 scripts/prepare_pages.py
          python3 scripts/verify_site.py
      - uses: deploy-pages
        inputs:
          deploy-dir: dist/
          production-branch: main
          site-name: roboconductor-showcase-release
